version: '3.2'
services:
  web:
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ./chat
        target: /opt/application
      - type: bind
        source: ./chat/static
        target: /opt/application/static
  statics:
    stdin_open: true
    tty: true
    build:
      context: .
      dockerfile: Dockerfile.static
    environment:
      FRONTEND_ASSSET_ROOT_DIR: "/opt/application/static"
    volumes:
      - type: bind
        source: ./chat
        target: /opt/application
      - type: bind
        source: ./chat/static
        target: /opt/application/static
      # Mask the bind-mounted (and possibly stale) host node_modules with an
      # anonymous volume seeded from the image, so the container always uses
      # the deps installed during `docker compose build` (vite, etc).
      - /opt/application/frontend/node_modules
volumes:
  rundir: {}
  application: {}
